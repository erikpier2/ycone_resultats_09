    async function loadCsvTable() {
        try {
            const response = await fetch(csvFileUrl);
            if (!response.ok) throw new Error("Le fichier 'aout2026.csv' est introuvable.");
            
            // 1. Lecture binaire forcée en Windows-1252 pour corriger les accents é, à, ç
            const buffer = await response.arrayBuffer();
            const decoder = new TextDecoder('windows-1252'); // Force la lecture des é, à, ç corrects
            const textData = decoder.decode(buffer);
            
            const lines = textData.split(/\r?\n/);
            if (lines.length === 0) throw new Error("Le fichier CSV est vide.");

            // 1.2. Détection des colonnes sans données
            // On stocke les index des colonnes qui contiennent au moins une cellule non vide
            const colonnesAvecDonnees = new Set();   
            lines.forEach((line, rowIndex) => {
                if (line.trim() === "" || /^;+$/.test(line.trim())) return; 
                // On n'analyse que les lignes de données (à partir de la 3ème ligne, index >= 2) 
                if (rowIndex >= 2) {              
                    const cells = line.split(';');
                    cells.forEach((cellValue, colIndex) => {
                        if (cellValue.trim() !== "") {
                            colonnesAvecDonnees.add(colIndex); // On marque cette colonne comme ayant des données
                    }
                });
              }  
            }); 

             // On vérifie si le groupe de 5 colonnes dynamiques contient la moindre données
            function estGroupeActif(indexDeDepart) {
                for (let i = 0; i < 5; i++) {
                    if (colonnesAvecDonnees.has(indexDeDepart +i)) return true;
                }
                return false; // Le groupe de 5 colonnes est 100% vide sur tout le fichier
              }

            // 2. Construction du tableau HTML
            let htmlRaw = "<table><thead>";
            let isBodyOpen = false;
            // --- CONFIGURATION DE VOS COLONNES À COLORER ---
            // Indiquez ici les index (commençant à 0) des colonnes de choix que vous voulez colorer
            // Exemple : index 4 (5ème colonne) et index 9 (10ème colonne)
            const colonnesDeChoix = [4,9,14,19,24,29,34,39,44,49,54,59,64,69,74,79,84,89,94,99]; // Modifiez selon vos besoins

            lines.forEach((line, rowIndex) => {
                    // Nettoie les lignes vides, les lignes d'espaces et les résidus Excel (;;;;;)
                    if (line.trim() === "" || /^;+$/.test(line.trim())) return;                             

                    const cells = line.split(';');

                    // Gestion des classes de lignes d'en-tête (sticky)
                    let rowClass = "";
                    if (rowIndex === 0) rowClass = ' class="sticky-row-1"';
                    else if (rowIndex === 1) rowClass = ' class="sticky-row-2"';

                    // Transition entre l'en-tête (thead) et le corps (tbody)
                    if (rowIndex === 2 && !isBodyOpen) {
                        htmlRaw += "</thead><tbody>";
                        isBodyOpen = true;
                    }
                  
                    htmlRaw += `<tr${rowClass}>`; 
                    
                    // On utilise un index de cellule virtuel pour gérer les sauts (skip) de fusions corrctement
                    let colVirtualIndex = 0;

                    for (let colIndex = 0; colIndex < cells.length; colIndex++) {
                        let cleanValue = cells[colIndex].trim();
                        const cellTag = rowIndex < 2 ? 'th' : 'td';
                    
                    //---Configuration auto des masquage de groupes

                        if (colIndex >= 3) {
                            // Calcule l'index de départ du groupe de 5 auquel appartient la colonne actuelle (3,8,13,18,23...)
                        const startGroupIdx = 3 + Math.floor((colIndex -3) / 5) * 5;
                            // Si ce groupe spécifique est complètement vide, on l'ignore silencieusement
                            if  (!estGroupeActif(startGroupIdx)) {
                                continue; // Passe directement à la ligne suivante (ligne1, ligne2 et tbody inclus !)                                
                            }
                        }
                            
                    // --- CSS DES COLONNES FIXES ---
                    let cellClass = "";
                    if (colIndex === 0) cellClass = 'col-1';
                    else if (colIndex === 1) cellClass = 'col-2';
                    else if (colIndex === 2) cellClass = 'col-3';
                    else cellClass = 'dynamic-col';

                    // --- CORRECTION DU FILTRE DES TEMPS (Moins de 1 heure -> mm:ss) ---
                    if (cleanValue.includes(':')) {
                        const timeParts = cleanValue.split(':');
                        if (timeParts.length === 3) {
                            const hours = timeParts[0].trim();
                            if (hours === '00' || hours === '0' || hours === '') {
                                cleanValue = `${timeParts[1]}:${timeParts[2]}`; 
                            }
                        }
                    }                    

                        // --- COLORATION DES COLONNES DE CHOIX ---
                    if (colonnesDeChoix.includes(colIndex) && rowIndex >= 2) {
                        cellClass += ' col-choix';
                    }

                    // ---RÉCUPÉRATION DU CONTENU DE LA CELLULE AVEC LIEN CLIQUABLE---
                    // Gestion des liens cliquables
                    let displayContent = cleanValue;

                    // A. Vérifie si le texte exact de la cellule est présent dans votre dictionnaire
                    if (liensPersonnalises[cleanValue]) {

                        displayContent = `<a href="${liensPersonnalises[cleanValue]}" target="_blank">${cleanValue}</a>`;
                    }
                    // B. Sécurité : Si la cellule contient déjà un lien brut écrit en texte (http...)
                    else if (cleanValue.startsWith('http://') || cleanValue.startsWith('https://')) {
                        displayContent = `<a href="${cleanValue}" target="_blank">${cleanValue}</a>`;
                    }
                    
                    // --- DÉTECTION ET FOND NEUTRE POUR LES GROUPES DE 5 CELLULES VIDES ---
                    if (rowIndex >= 2 && colIndex >= 3) {
                        // On calcule à quel groupe de 5 appartient la cellule (ex: col 3 à 7 = groupe 0, col 8 à 12 = groupe 1)
                        const debutGroupe = 3 + Math.floor((colIndex - 3) / 5) * 5;
                        const finGroupe = debutGroupe + 5;

                        // On extrait les 5 cellules de ce groupe sur la ligne actuelle
                        const cellulesDuGroupe = cells.slice(debutGroupe, finGroupe);

                        // On vérifie si TOUTES les cellules de ce groupe sont vides
                        const estGroupeEntierementVide = cellulesDuGroupe.every(val => val.trim() === "");

                        if (estGroupeEntierementVide) {
                            cellClass += ' groupe-vide';
                        }
                    }


                    // --- CORRECTION DES DATES EXCEL (Ex: "sept.-12" ou "09/12/2026" -> "9/12") ---
                    // Détecte le format de date généré par Excel (ex: sep-12, sept.-12, 09/12/2012)
                    if (cleanValue.includes('-') || (cleanValue.includes('/') && cleanValue.split('/').length === 3)) {
                        // Liste des mois pour faire la correspondance
                        const mois = {
                            "janv": "1", "févr": "2", "mars": "3", "avr": "4", "mai": "5", "juin": "6",
                            "juil": "7", "août": "8", "sept": "9", "oct": "10", "nov": "11", "déc": "12",
                            "sep": "9", "feb": "2", "apr": "4", "aug": "8", "dec": "12" // Sécurité anglais/raccourcis
                        };
                      
                        // Cas 1 : Excel a exporté sous forme "sept.-12" ou "sep-12"
                        if (cleanValue.includes('-')) {
                            const parts = cleanValue.toLowerCase().replace('.', '').split('-');
                            if (parts.length === 2 && mois[parts[0]]) {
                                cleanValue = `${mois[parts[0]]}/${parts[1]}`;
                            }
                        }
                        // Cas 2 : Excel a exporté sous forme "09/12/2012" (format date complet jj/mm/aaaa ou mm/jj/aaaa)
                        // Si votre colonne Pl. exprime la 9ème place sur 12, Excel stocke souvent le 9 du mois sur le 12ème mois
                        else {
                            const parts = cleanValue.split('/');
                            // On récupère le jour (09 -> 9) et le mois (12)
                            const jour = parseInt(parts[0], 10);
                            const moisNum = parseInt(parts[1], 10);
                            if (moisNum === 12) { // Sécurité pour s'assurer qu'on cible votre format sur 12
                                cleanValue = `${jour}/${moisNum}`;
                            }
                        }
                    } 

                    // --- CONFIGURATION DE VOS FUSIONS DE LIGNES (Ligne 1) ---
                    let colspanAttr = "";
                    let skipCell = false;

                    if (rowIndex === 0) {  
                    // Bloc fusionné 1 (index 0 à 2)
                    if (colIndex === 0) {                    
                      colspanAttr = ' colspan="3"'; 
                    } else if (colIndex === 1 || colIndex === 2) { skipCell = true; }  
                                      
                    // Traitement auto de 20 Grandes groupe colonnes
                    else if (colIndex >=3) { 
                    // On trouve l'emplacement relatif de la colonne àl'intérieur de son bloc de 5(0,1,2,3,4)
                            const positionDansLeBloc = (colIndex - 3) % 5;  
                            if (positionDansLeBloc === 0) {
                            // C'est la première colonne d'un bloc actif : on lui donne sa fusion de 5
                            colspanAttr = ' colspan="5" ';  
                            } else {
                            // Ce sont les 4 cellules suivantes du bloc: on les fusionne (efface)
                            skipCell = true;                            
                            }
                          }  
                        }
                        if (skipCell) continue;

                        htmlRaw += `<${cellTag} class="${cellClass}"${colspanAttr}>${displayContent}</${cellTag}>`;
                            }

                        htmlRaw += "</tr>";
                        });

                      htmlRaw += isBodyOpen ? "</tbody></table>"  : "</thead></table>";
                      
                      const container = document.getElementById('excel-table-container');
                      container.innerHTML = htmlRaw;

                      document.getElementById('loading').style.display = 'none';

                  } catch (error) {
                      console.error("Détails :", error);
                      document.getElementById('loading').innerText = "Erreur : " + error.message;
                  }
              }

              window.onload = loadCsvTable;
</script>
